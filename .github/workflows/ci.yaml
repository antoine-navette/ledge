name: PR Lifecycle (Quality, Build, Staging)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. QUALITY CHECKS
  # ==========================================
  quality_web:
    name: Web checks (format, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run lint
        working-directory: web

  quality_api:
    name: API checks (format, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
        working-directory: api
      - run: npm run format:check
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm run test:unit
        working-directory: api

  # ==========================================
  # 2. BUILD IMAGES
  # ==========================================
  build_web:
    name: Build Web
    needs: [quality_web, quality_api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/antoine-navette/ledge-web:${{ github.event.pull_request.head.sha }} \
            -f web/Dockerfile \
            --push web

  build_api:
    name: Build API
    needs: [quality_web, quality_api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t ghcr.io/antoine-navette/ledge-api:${{ github.event.pull_request.head.sha }} \
            -f api/Dockerfile \
            --push api

  # ==========================================
  # 3. DEPLOY STAGING
  # ==========================================
  deploy_staging:
    name: Deploy to Staging
    needs: [build_web, build_api]
    runs-on: [self-hosted, ledge]
    env:
      TARGET_PATH: /srv/apps/ledge/staging
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR code
        run: |
          cd "$TARGET_PATH"
          git fetch
          git checkout $HEAD_SHA
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      - name: Deploy
        run: |
          cd "$TARGET_PATH"
          docker compose pull
          docker compose run --rm --no-deps api node dist/scripts/migrate.js
          docker compose down --remove-orphans
          docker compose up -d
