name: PR Lifecycle (Quality, Build, Staging)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. QUALITY CHECKS
  # ==========================================
  quality_web:
    name: Web checks (format, lint, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      # Build mode, since the web config only references the app and Vite configs
      - run: npx tsc -b
        working-directory: web
      # The types must match the committed spec, which the API job checks against the code
      - run: npm run api:generate
        working-directory: web
      - run: git diff --exit-code types.gen.ts
        working-directory: web

  quality_api:
    name: API checks (format, lint, types, unit tests, OpenAPI spec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm ci
        working-directory: api
      - run: npm run format:check
        working-directory: api
      - run: npm run lint
        working-directory: api
      # --noEmit: the config has an outDir, a plain tsc would build into dist
      - run: npx tsc --noEmit
        working-directory: api
      - run: npm run test:unit
        working-directory: api
      # The committed spec must match the routes: run docs:generate after changing one
      - run: npm run docs:generate
        working-directory: api
      - run: git diff --exit-code openapi.json
        working-directory: api

  # ==========================================
  # 2. BUILD IMAGES
  # ==========================================
  build_web:
    name: Build Web
    needs: [quality_web, quality_api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      # The server is ARM64 only: QEMU emulates it on the x86 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ghcr.io/antoine-navette/ledge-web:${{ github.event.pull_request.head.sha }} \
            -f web/Dockerfile \
            --push web

  build_api:
    name: Build API
    needs: [quality_web, quality_api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      # The server is ARM64 only: QEMU emulates it on the x86 runner
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build & push
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ghcr.io/antoine-navette/ledge-api:${{ github.event.pull_request.head.sha }} \
            -f api/Dockerfile \
            --push api

  # ==========================================
  # 3. DEPLOY STAGING
  # ==========================================
  deploy_staging:
    name: Deploy to Staging
    needs: [build_web, build_api]
    runs-on: [self-hosted, ledge]
    # One deployment at a time: a new one waits for the current one instead of interrupting it (e.g. during a migration)
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      TARGET_PATH: /srv/apps/ledge/staging
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout PR code
        run: |
          cd "$TARGET_PATH"
          git fetch
          git checkout $HEAD_SHA
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin
      - name: Deploy
        run: |
          cd "$TARGET_PATH"
          docker compose pull
          docker compose run --rm --no-deps api npm run migrations:run
          docker compose up -d --remove-orphans
