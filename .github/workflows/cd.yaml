name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  # Only pulls the images built for the pull request
  packages: read

jobs:
  deploy_prod:
    name: Deploy to Production
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, ledge]
    # One deployment at a time: a new one waits for the current one instead of interrupting it (e.g. during a migration)
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      TARGET_PATH: /srv/apps/ledge/prod
      # The images built and deployed to staging for the pull request's last commit
      IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u antoine-navette --password-stdin

      - name: Pull latest code
        run: |
          cd "$TARGET_PATH"
          git pull

      - name: Deploy
        run: |
          cd "$TARGET_PATH"
          docker compose pull
          docker compose run --rm --no-deps api npm run migrations:run
          docker compose up -d --remove-orphans
