name: Build

on:
  # Every merge into main
  push:
    branches: [main]
  # Any branch, chosen in GitHub's "Run workflow" menu, to try it on staging before merging it
  workflow_dispatch:

permissions:
  contents: read

# One build at a time per branch, never cancelled: on main, each merge gets its own image, deployed in order
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml

  build:
    name: Build ${{ matrix.app }}
    needs: checks
    # Same architecture as the server: the image is built natively, without emulation
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    outputs:
      # Identical for both apps, so it doesn't matter which one sets it
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # Immutable, one per commit: always says which commit an image comes from, and lets a deployment be rolled back
      # by redeploying an older tag
      - name: Compute the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/antoine-navette/ledge-${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          # Lets the server remove Ledge's unused images without touching the other projects' ones
          labels: app=ledge
          # Reuses the layers of the previous builds (e.g. the installed dependencies when the lockfile didn't change),
          # one cache per app so they don't overwrite each other
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy-staging:
    name: Staging
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: staging
      tag: ${{ needs.build.outputs.tag }}

  # Waits for an approval (production environment settings), then deploys the very image tested on staging
  deploy-production:
    name: Production
    needs: [build, deploy-staging]
    # Never a branch built to try it on staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: production
      tag: ${{ needs.build.outputs.tag }}
