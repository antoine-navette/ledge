services:
  api:
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    volumes:
      - mongo:/data/db
    tmpfs:
      - /data/configdb
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo:
