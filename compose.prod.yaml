services:
  web:
    image: ghcr.io/antoine-navette/ledge-web:${IMAGE_TAG}
    # Only reachable from the server itself, where cloudflared forwards the requests
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    restart: unless-stopped

  api:
    image: ghcr.io/antoine-navette/ledge-api:${IMAGE_TAG}
    env_file:
      - path: api/.env
        required: true
    restart: unless-stopped

  mongo:
    # Only reachable from the server itself: connect through an SSH tunnel
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    restart: unless-stopped

  # Dumps the database every night into ./dumps, and before each deployment's migrations (see backup/backup.sh)
  backup:
    image: ghcr.io/antoine-navette/ledge-backup:${IMAGE_TAG}
    # The deployment's dump also starts Mongo first if it isn't running yet, e.g. on a new environment
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    # Outside Mongo's volume, so that a docker compose down -v doesn't remove them
    volumes:
      - ./dumps:/dumps
    restart: unless-stopped
