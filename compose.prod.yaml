services:
  web:
    image: ghcr.io/antoine-navette/ledge-web:${IMAGE_TAG}
    env_file:
      - path: web/.env
        required: true
    ports:
      - "${WEB_PORT}:80"
    restart: unless-stopped

  api:
    image: ghcr.io/antoine-navette/ledge-api:${IMAGE_TAG}
    env_file:
      - path: api/.env
        required: true
    ports:
      - "${API_PORT}:3000"
    restart: unless-stopped

  mongo:
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    restart: unless-stopped
