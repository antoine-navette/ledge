services:
  frontend:
    image: ghcr.io/antoine-navette/ledge-frontend:${IMAGE_TAG}
    env_file:
      - path: frontend/.env
        required: true
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped

  backend:
    image: ghcr.io/antoine-navette/ledge-backend:${IMAGE_TAG}
    env_file:
      - path: backend/.env
        required: true
    ports:
      - "${BACKEND_PORT}:3000"
    restart: unless-stopped

  mongo:
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    restart: unless-stopped
