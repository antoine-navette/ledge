services:
  web:
    build:
      context: web
      dockerfile: Dockerfile.dev
    env_file:
      - path: web/.env.example
        required: true
      - path: web/.env
        required: false
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app

  api:
    build:
      context: api
      dockerfile: Dockerfile.dev
    env_file:
      - path: api/.env.example
        required: true
      - path: api/.env
        required: false
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./api:/app
    depends_on:
      mailpit:
        condition: service_healthy

  mongo:
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mailpit:
